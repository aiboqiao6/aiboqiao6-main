<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090d12" />
    <meta name="description" content="雾蓝回针 MistBlueSt 的个人主页、GitHub 状态与开源项目。" />
    <title>雾蓝回针 · MistBlueSt</title>
    <link rel="icon" type="image/jpeg" href="https://github.com/aiboqiao6.png?size=64" />
    <link rel="apple-touch-icon" href="https://github.com/aiboqiao6.png?size=180" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="background" aria-hidden="true"></div>
    <div class="app-shell">
      <header class="topbar">
        <nav class="top-nav" aria-label="主导航">
          <a class="top-nav-link is-active" href="#home">主页</a>
          <a class="top-nav-link" href="#github">GitHub</a>
          <a class="top-nav-link" href="#projects">项目</a>
          <a class="top-nav-link" href="#contact">联系</a>
        </nav>
      </header>

      <main class="personal-layout" id="home">
        <section class="identity-stage" aria-labelledby="profileName">
          <div class="stage-signal"><span>PERSONAL SPACE</span><span class="stage-line"></span></div>
          <div class="cute-assets" aria-hidden="true">
            <img class="cute-asset cute-asset-sparkles" src="./assets/cute-sparkles.svg" width="44" height="44" decoding="async" alt="" />
            <img class="cute-asset cute-asset-heart" src="./assets/cute-heart.svg" width="39" height="39" decoding="async" alt="" />
            <img class="cute-asset cute-asset-blossom" src="./assets/cute-blossom.svg" width="36" height="36" decoding="async" alt="" />
          </div>
          <div class="identity-content">
            <div class="avatar-wrap">
              <img class="avatar-sticker" src="./assets/cute-heart.svg" width="46" height="46" decoding="async" alt="" aria-hidden="true" />
              <img class="profile-avatar" src="https://github.com/aiboqiao6.png?size=320" width="320" height="320" decoding="async" fetchpriority="high" alt="雾蓝回针" />
            </div>
            <div class="identity-details">
              <div class="profile-marker" aria-hidden="true"><i></i><span>PROFILE</span><b>01</b></div>
              <h1 id="profileName"><span class="name-cn">雾蓝回针</span><span class="name-latin">MistBlueSt</span></h1>
              <p class="identity-handle">@aiboqiao6</p>
              <p class="identity-summary">填写个人简介</p>
            </div>
            <div class="profile-numbers" id="profileNumbers" aria-label="GitHub 账户统计" hidden>
              <div><strong id="profileRepos"></strong><span>公开仓库</span></div>
              <div><strong id="profileFollowers"></strong><span>关注者</span></div>
              <div><strong id="profileContributions"></strong><span>年度贡献</span></div>
            </div>
          </div>
          <div class="stage-footer">
            <div class="social-links"><a href="https://github.com/aiboqiao6" target="_blank" rel="noreferrer">GitHub</a><a href="https://space.bilibili.com/1333894801" target="_blank" rel="noreferrer">Bilibili</a><a href="https://so.csdn.net/so/search?q=aiboqiao6" target="_blank" rel="noreferrer">CSDN</a><a href="https://x.com/aiboqiao6" target="_blank" rel="noreferrer">X</a></div>
            <a class="scroll-cue" href="#github"><span>向下浏览</span><i>↓</i></a>
          </div>
        </section>

        <aside class="info-rail" aria-label="GitHub 状态与项目">
          <section class="info-panel github-panel" id="github" hidden>
            <div class="panel-heading"><div><span class="panel-index">01</span><h2>GitHub 状态</h2></div><span class="live-label"><i></i> LIVE</span></div>
            <div class="github-summary">
              <div class="contribution-total"><strong id="contributionTotal"></strong><span>次贡献</span><small>过去一年</small></div>
              <div class="github-facts"><div><span>最近活动</span><strong id="lastActivity"></strong></div><div><span>主要语言</span><strong id="topLanguage"></strong></div></div>
            </div>
            <div class="contribution-wrap" aria-label="GitHub 年度贡献热力图"><div class="month-labels" aria-hidden="true"><span>8月</span><span>10月</span><span>12月</span><span>2月</span><span>4月</span><span>6月</span></div><div class="contribution-grid" id="contributionGrid"></div></div>
            <div class="contribution-legend"><span id="githubStatus"></span><div><small>少</small><i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i><small>多</small></div></div>
          </section>

          <section class="info-panel projects-panel" id="projects" hidden>
            <div class="panel-heading"><div><span class="panel-index">02</span><h2>开源项目</h2></div><a href="https://github.com/aiboqiao6?tab=repositories" target="_blank" rel="noreferrer">全部仓库 ↗</a></div>
            <div class="project-list" id="projectList"></div>
          </section>

          <nav class="contact-strip" id="contact" aria-label="社交平台">
            <span class="contact-label">FIND ME</span>
            <a href="https://github.com/aiboqiao6" target="_blank" rel="noreferrer"><span class="contact-icon github-icon"><img src="./assets/github.svg" width="15" height="15" loading="lazy" decoding="async" alt="" /></span><span>GitHub</span><small>@aiboqiao6</small><b>↗</b></a>
            <a href="https://space.bilibili.com/1333894801" target="_blank" rel="noreferrer"><span class="contact-icon bilibili-icon"><img src="./assets/bilibili.svg" width="17" height="17" loading="lazy" decoding="async" alt="" /></span><span>Bilibili</span><small>@1333894801</small><b>↗</b></a>
            <a href="https://so.csdn.net/so/search?q=aiboqiao6" target="_blank" rel="noreferrer"><span class="contact-icon csdn-icon"><img src="./assets/csdn.svg" width="18" height="18" loading="lazy" decoding="async" alt="" /></span><span>CSDN</span><small>搜索 aiboqiao6</small><b>↗</b></a>
            <a href="https://x.com/aiboqiao6" target="_blank" rel="noreferrer"><span class="contact-icon x-icon"><img src="./assets/x.svg" width="15" height="15" loading="lazy" decoding="async" alt="" /></span><span>X</span><small>@aiboqiao6</small><b>↗</b></a>
          </nav>

          <footer class="info-footer"><span>© 2026 雾蓝回针 · MistBlueSt</span><a href="#home">回到顶部 ↑</a></footer>
        </aside>
      </main>
    </div>
    <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>
    <script src="./script.js"></script>
  </body>
</html>
